<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 · YZWAI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=yzwai">
    <link rel="stylesheet" href="/style.css">
    <script src="/admin-login.js" defer></script>
</head>
<body class="login-page"><div class="login-layout"><aside class="login-brand-panel"><a href="/" class="brand-link"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l7 8 7-8M12 13v7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><span class="brand-name">YZWAI</span><span class="brand-caption">SUBSCRIPTION CONSOLE</span></span></a><div><h2>管理每一笔订阅，<br>掌握每一步进度。</h2><p>卡密、订单、支付卡片与链路日志，在一个工作空间内完成管理。</p></div><span class="login-footnote">YZWAI / ADMINISTRATION</span></aside><main class="login-card">
        <form id="stepLogin" class="step active">
            <h1>后台登录</h1>
            <p>使用管理员邮箱和密码登录。若已启用二次验证，登录后还需验证。</p>
            <label for="email">管理员邮箱</label>
            <input id="email" type="email" placeholder="请输入管理员邮箱" autocomplete="username" required>
            <label for="password">登录密码</label>
            <div class="password-field">
                <input id="password" type="password" placeholder="请输入登录密码" autocomplete="current-password" required>
                <button id="togglePassword" type="button" class="password-toggle" aria-label="切换密码显示" aria-pressed="false">显示</button>
            </div>
            <button id="loginBtn" type="submit">登录管理后台</button>
        </form>

        <form id="step2fa" class="step">
            <h1>二次验证</h1>
            <p id="step2faHint">请选择验证方式并输入验证码。</p>
            <div id="methodTabs" class="method-tabs" hidden></div>
            <div id="methodSingle" class="method-single" hidden></div>
            <div id="methodHint" class="method-hint"></div>
            <label for="code">验证码</label>
            <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="6 位验证码" autocomplete="one-time-code">
            <button id="sendTgBtn" type="button" class="secondary" hidden>发送 Telegram 验证码</button>
            <button id="verifyBtn" type="submit">验证并登录</button>
            <button id="backBtn" type="button" class="secondary">返回</button>
        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>
        <div class="hint">登录失败 5 次将锁定 30 分钟。登录后可在「接单与安全」切换验证方式。</div>
        <a href="/" class="login-back">← 返回用户兑换页</a>
    </main></div></body>
</html>
