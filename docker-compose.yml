# Keep the project name and mysql_data volume when upgrading.
name: kc-gpt-pay2
services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-kc-gpt-pay2-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-kc-gpt-pay2-app}
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TASK_LOG_DIR: /var/log/pay-gpt-orbit
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-20}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-100}
      DB_LOCK_LIMIT: ${DB_LOCK_LIMIT:-32}
      DB_MAX_IDLE: ${DB_MAX_IDLE:-5}
      DB_STATEMENT_CACHE_LIMIT: ${DB_STATEMENT_CACHE_LIMIT:-256}
      LOG_CACHE_ENTRIES: ${LOG_CACHE_ENTRIES:-2000}
      LOG_CACHE_BYTES: ${LOG_CACHE_BYTES:-4194304}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-256kb}
      TRUST_PROXY: ${TRUST_PROXY:-}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-180}
      API_WRITES_PER_MINUTE: ${API_WRITES_PER_MINUTE:-30}
      API_TOTAL_REQUESTS_PER_MINUTE: ${API_TOTAL_REQUESTS_PER_MINUTE:-1200}
      API_MAX_CONCURRENT: ${API_MAX_CONCURRENT:-64}
      API_MAX_CONCURRENT_PER_IP: ${API_MAX_CONCURRENT_PER_IP:-12}
      API_MAX_TRACKED_IPS: ${API_MAX_TRACKED_IPS:-10000}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-500}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-200}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-5}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Set a random ADMIN_TOKEN_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vru.cc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECONDARY_PASSWORD: ${ADMIN_SECONDARY_PASSWORD:-}
      ADMIN_LOGIN_PATH: ${ADMIN_LOGIN_PATH:-admin-login}
      ADMIN_PANEL_PATH: ${ADMIN_PANEL_PATH:-admin}
      ORBITCARD_API_KEY: ${ORBITCARD_API_KEY:-}
      ORBITCARD_API_SECRET: ${ORBITCARD_API_SECRET:-}
      CDK_REDEMPTION_WEBHOOK_URL: ${CDK_REDEMPTION_WEBHOOK_URL:-}
      CDK_REDEMPTION_SOURCE: ${CDK_REDEMPTION_SOURCE:-pay-gpt-orbit}
      CDK_REDEMPTION_WEBHOOK_SECRET: ${CDK_REDEMPTION_WEBHOOK_SECRET:-}
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data
      - ${APP_LOG_DIR:-/var/log/pay-gpt-orbit}:/var/log/pay-gpt-orbit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql_data:
