# Keep the project name and mysql_data volume when upgrading.
name: kc-gpt-pay2
services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-kc-gpt-pay2-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-kc-gpt-pay2-app}
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TASK_LOG_DIR: /app/data/logs
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-20}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-256kb}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Set a random ADMIN_TOKEN_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vru.cc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECONDARY_PASSWORD: ${ADMIN_SECONDARY_PASSWORD:-}
      ADMIN_LOGIN_PATH: ${ADMIN_LOGIN_PATH:-admin-login}
      ADMIN_PANEL_PATH: ${ADMIN_PANEL_PATH:-admin}
      ORBITCARD_API_KEY: ${ORBITCARD_API_KEY:-}
      ORBITCARD_API_SECRET: ${ORBITCARD_API_SECRET:-}
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql_data:
